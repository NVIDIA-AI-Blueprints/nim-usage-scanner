name: Daily NIM Usage Scan

# Title shown per run in the Actions list. GitHub expressions have no date
# function, so this uses the incrementing run number rather than a date.
run-name: "Daily Scan - #${{ github.run_number }}"

# Required secrets:
# - CI_NVIDIA_API_KEY: for querying Blueprints information from NVIDIA NGC
# - CI_GITHUB_TOKEN: for fetching repository metadata and cloning repositories
# Optional secrets:
# - CI_SLACK_BOT_OAUTH_TOKEN: for sending notifications to Slack

# Builds the scanner, refreshes the blueprint list from the Build API, then runs
# a single scan against the refreshed list. The refreshed config and reports are
# stored as artifacts, and a summary (repos added/removed/deprecated plus
# blueprints affected by deprecated NIMs) is written to the run's job summary.
on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      always_send_slack:
        description: 'Send the Slack notification even when nothing changed'
        type: boolean
        default: true
      slack_channel:
        description: 'Channel name/ID, or a user ID (U...) to DM yourself when testing'
        type: string
        default: 'vrdc-bpqa-monitoring'
      ignored_blueprints:
        description: 'Comma-separated blueprint names or repos to ignore in the scan summary'
        type: string
        default: 'NVIDIA/NemoClaw'

permissions:
  contents: read

# Don't let a slow run overlap with the next scheduled one.
concurrency:
  group: daily-nim-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_LOG: info
      ALWAYS_SEND_SLACK: ${{ github.event.inputs.always_send_slack || 'true' }}
      SLACK_CHANNEL: ${{ github.event.inputs.slack_channel || 'vrdc-bpqa-monitoring' }}
      IGNORED_BLUEPRINTS: ${{ github.event.inputs.ignored_blueprints || 'NVIDIA/NemoClaw' }}
      SLACK_OWNER: 'U0B3BBFQVSR'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Pinned SHA is the org-allowlisted release of setup-rust-toolchain
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Build (release)
        run: cargo build --release

      - name: Refresh repos config
        run: |
          python scripts/refresh_repos_config.py \
            --config config/repos.yaml \
            --output output/repos-refreshed.yaml \
            --summary-json output/repos_refresh_summary.json

      - name: Run NIM scan
        env:
          NVIDIA_API_KEY: ${{ secrets.CI_NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: 1  # skip LFS file download during clone
        run: |
          ./target/release/nim-usage-scanner scan -c output/repos-refreshed.yaml \
            -o output --jobs 4 --check-deprecation

      - name: Build scan summary
        id: summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/workflows/scripts/build-scan-summary.py \
            --refresh-summary output/repos_refresh_summary.json \
            --affected output/deprecation_affected_blueprints.json \
            --affected-local-nims-safe \
            --ignore-blueprints "${IGNORED_BLUEPRINTS}" \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --run-url "${RUN_URL}" \
            --html-out output/scan-summary.html \
            --slack-out output/slack-message.json
          cat output/scan-summary.html >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          SLACK_BOT_OAUTH_TOKEN: ${{ secrets.CI_SLACK_BOT_OAUTH_TOKEN }}
          JOB_FAILED: ${{ failure() }}
          COLOR: ${{ steps.summary.outputs.color }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_BOT_OAUTH_TOKEN" ]; then
            echo "SLACK_BOT_OAUTH_TOKEN not set; skipping Slack notification."
            exit 0
          fi

          send() {  # $1 = channel, $2 = JSON payload
            resp=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_OAUTH_TOKEN" \
              -H 'Content-type: application/json; charset=utf-8' \
              --data "$2")
            if [ "$(echo "$resp" | jq -r '.ok')" = "true" ]; then
              echo "Slack message sent to $1."
            else
              echo "Slack error ($1): $(echo "$resp" | jq -r '.error // "unknown"')"
            fi
          }

          # Job failed -> danger alert to the owner only.
          if [ "$JOB_FAILED" = "true" ]; then
            payload=$(jq -n \
              --arg ch "$SLACK_OWNER" \
              --arg title ":rotating_light: Daily NIM Usage Scan #${GITHUB_RUN_NUMBER} failed" \
              --arg url "$RUN_URL" \
              '{channel: $ch, attachments: [{
                 color: "danger",
                 title: $title,
                 title_link: $url,
                 text: ("The daily scan workflow failed. <" + $url + "|View run>"),
                 mrkdwn_in: ["text"]
               }]}')
            send "$SLACK_OWNER" "$payload"
            exit 0
          fi

          # Success: send the scan summary to the channel (on change or when
          # forced), and DM the owner on danger/warning.
          if [ "$COLOR" != "good" ] || [ "$ALWAYS_SEND_SLACK" = "true" ]; then
            send "$SLACK_CHANNEL" "$(jq --arg ch "$SLACK_CHANNEL" '. + {channel: $ch}' output/slack-message.json)"
          fi
          if [ "$COLOR" != "good" ]; then
            send "$SLACK_OWNER" "$(jq --arg ch "$SLACK_OWNER" '. + {channel: $ch}' output/slack-message.json)"
          fi

      - name: Upload binary, config, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            target/release/nim-usage-scanner
            config/
            output/
          if-no-files-found: warn
          retention-days: 30
