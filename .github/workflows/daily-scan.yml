name: Daily NIM Usage Scan

# Title shown per run in the Actions list. GitHub expressions have no date
# function, so this uses the incrementing run number rather than a date.
run-name: "Daily Scan - #${{ github.run_number }}"

# Required secrets:
# - CI_NVIDIA_API_KEY: for querying Blueprints information from NVIDIA NGC
# - CI_GITHUB_TOKEN: for fetching repository metadata and cloning repositories
# Optional secrets:
# - SLACK_WEBHOOK_URL: for sending notifications to Slack

# Builds the scanner and runs it once a day twice: first against the committed
# blueprint list (no refresh), then against a freshly refreshed list. Both
# configs and reports are stored as artifacts, and a comparison of the two runs
# is written to the run's job summary.
on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      always_send_slack:
        description: 'Send the Slack notification even when nothing changed'
        type: boolean
        default: false

permissions:
  contents: read

# Don't let a slow run overlap with the next scheduled one.
concurrency:
  group: daily-nim-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_LOG: info
      # Send the Slack notification regardless of scan results. Defaults to
      # false; a manual (workflow_dispatch) run can override via its input.
      ALWAYS_SEND_SLACK: ${{ github.event.inputs.always_send_slack || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python is needed for `--refresh-repos` (scripts/generate_repos_from_ngc.py,
      # 3.10+ syntax) and `--check-deprecation`
      # (scripts/find_deprecated_blueprints.py, which needs PyYAML).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyYAML for scripts/find_deprecated_blueprints.py (run by
      # --check-deprecation). The scanner has no .venv in CI, so it invokes
      # `python3` on PATH — install the dependency into that interpreter.
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Pinned SHA is the org-allowlisted release of setup-rust-toolchain (the
      # maintained successor to dtolnay/rust-toolchain). It also caches cargo
      # build artifacts between runs, so no separate rust-cache step is needed.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Build (release)
        run: cargo build --release

      # First scan: use the committed config as-is (no refresh). Reports go to
      # ./output and the committed config/ is left untouched.
      - name: Run NIM scan (no refresh)
        env:
          NVIDIA_API_KEY: ${{ secrets.CI_NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: 1  # skip LFS file download during clone
        run: |
          ./target/release/nim-usage-scanner scan -c config/repos.yaml \
            -o output --jobs 4 --check-deprecation

      # Second scan: refresh the blueprint list first. `--refresh-repos`
      # overwrites its config in place and reads repos.githubonly.yaml /
      # repos.ignored.yaml from the same dir, so copy the whole config/ dir to
      # config-refreshed/ and point the scan there. That keeps the committed
      # config/ pristine (as the "before" side of the diff) and leaves the
      # regenerated list in config-refreshed/. Reports go to ./output-refreshed.
      # Runs even if the first scan failed so the comparison still has data.
      - name: Run NIM scan (refresh repos)
        if: always()
        env:
          NVIDIA_API_KEY: ${{ secrets.CI_NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: 1  # skip LFS file download during clone
        run: |
          cp -r config config-refreshed
          ./target/release/nim-usage-scanner scan -c config-refreshed/repos.yaml \
            -o output-refreshed --refresh-repos --jobs 4 --check-deprecation

      # Compare the two runs and write an HTML summary to the run's Summary tab:
      # totals for both runs and repos added/removed after refreshing. Also
      # writes scan-summary.json (repo counts before/after, added/removed
      # counts) for the notify step. Degrades gracefully if a scan produced no
      # report.
      - name: Write scan comparison summary
        if: always()
        run: |
          python .github/workflows/scripts/build-daily-scan-summary.py \
            --original-output output \
            --refresh-output output-refreshed \
            --original-config config/repos.yaml \
            --refreshed-config config-refreshed/repos.yaml \
            --summary-json scan-summary.json \
            >> "$GITHUB_STEP_SUMMARY"

      # Notify when ALWAYS_SEND_SLACK is set, when refreshing added/removed
      # repos, or when either scan found a blueprint affected by a deprecated NIM.
      - name: Decide whether to notify
        id: decide
        if: always()
        run: |
          added=$(jq -r '.added // 0' scan-summary.json 2>/dev/null || echo 0)
          removed=$(jq -r '.removed // 0' scan-summary.json 2>/dev/null || echo 0)
          affected_before=$(jq -r '.affected_before // 0' scan-summary.json 2>/dev/null || echo 0)
          affected_after=$(jq -r '.affected_after // 0' scan-summary.json 2>/dev/null || echo 0)
          if [ "$ALWAYS_SEND_SLACK" = "true" ] \
             || [ "$added" -gt 0 ] || [ "$removed" -gt 0 ] \
             || [ "$affected_before" -gt 0 ] || [ "$affected_after" -gt 0 ]; then
            echo "should_notify=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_notify=false" >> "$GITHUB_OUTPUT"
          fi

      # Notify Slack when there is a config diff or an affected blueprint. No-ops
      # when SLACK_WEBHOOK_URL is unset, and a Slack hiccup never fails the job.
      - name: Notify Slack on changes
        if: always() && steps.decide.outputs.should_notify == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_VRDC_BPQA_MONITORING_CHANNEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi
          before=$(jq -r '.repos_before // 0' scan-summary.json)
          after=$(jq -r '.repos_after // 0' scan-summary.json)
          added=$(jq -r '.added // 0' scan-summary.json)
          removed=$(jq -r '.removed // 0' scan-summary.json)
          affected_before=$(jq -r '.affected_before // 0' scan-summary.json)
          affected_after=$(jq -r '.affected_after // 0' scan-summary.json)
          text=":rotating_light: *NIM Usage Scan #${RUN_NUMBER}*"
          if [ "$added" -gt 0 ] || [ "$removed" -gt 0 ]; then
            text="${text} — refreshing changed the repo list: ${before} → ${after} repos (added ${added}, removed ${removed})"
          fi
          text="${text} — blueprints affected by deprecated NIMs: ${affected_before} (original), ${affected_after} (refreshed)"
          text="${text}. <${RUN_URL}|View run>"
          jq -n --arg text "$text" '{text: $text}' \
            | curl -sSf -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"

      - name: Upload binary, configs, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            target/release/nim-usage-scanner
            config/
            config-refreshed/
            !config/repos.githubonly.yaml.example
            !config-refreshed/repos.githubonly.yaml.example
            output/
            output-refreshed/
          if-no-files-found: error
          retention-days: 30
