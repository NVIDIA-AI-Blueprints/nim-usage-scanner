name: Daily NIM Usage Scan

# Title shown per run in the Actions list. GitHub expressions have no date
# function, so this uses the incrementing run number rather than a date.
run-name: "Daily Scan - #${{ github.run_number }}"

# Required secrets:
# - CI_NVIDIA_API_KEY: for querying Blueprints information from NVIDIA NGC
# - CI_GITHUB_TOKEN: for fetching repository metadata and cloning repositories
# Optional secrets:
# - SLACK_WEBHOOK_URL: for sending notifications to Slack

# Builds the scanner, refreshes the blueprint list from the Build API, then runs
# a single scan against the refreshed list. The refreshed config and reports are
# stored as artifacts, and a summary (repos added/removed/deprecated plus
# blueprints affected by deprecated NIMs) is written to the run's job summary.
on:
  schedule:
    # 06:00 UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      always_send_slack:
        description: 'Send the Slack notification even when nothing changed'
        type: boolean
        default: false

permissions:
  contents: read

# Don't let a slow run overlap with the next scheduled one.
concurrency:
  group: daily-nim-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUST_LOG: info
      ALWAYS_SEND_SLACK: ${{ github.event.inputs.always_send_slack || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # Pinned SHA is the org-allowlisted release of setup-rust-toolchain
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606

      - name: Build (release)
        run: cargo build --release

      - name: Refresh repos config
        run: |
          python scripts/refresh_repos_config.py \
            --config config/repos.yaml \
            --output output/repos-refreshed.yaml \
            --summary-json output/repos_refresh_summary.json

      - name: Run NIM scan
        env:
          NVIDIA_API_KEY: ${{ secrets.CI_NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: 1  # skip LFS file download during clone
        run: |
          ./target/release/nim-usage-scanner scan -c output/repos-refreshed.yaml \
            -o output --jobs 4 --check-deprecation

      - name: Build scan summary
        id: summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python .github/workflows/scripts/build-scan-summary.py \
            --refresh-summary output/repos_refresh_summary.json \
            --affected output/deprecation_affected_blueprints.json \
            --run-number "${GITHUB_RUN_NUMBER}" \
            --run-url "${RUN_URL}" \
            --html-out output/scan-summary.html \
            --slack-out output/slack-message.json
          cat output/scan-summary.html >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on changes
        if: always() && (steps.summary.outputs.color != 'good' || env.ALWAYS_SEND_SLACK == 'true')
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_SLACK_WEBHOOK_VRDC_BPQA_MONITORING_CHANNEL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification."
            exit 0
          fi
          curl -sSf -X POST -H 'Content-type: application/json' \
            --data @output/slack-message.json "$SLACK_WEBHOOK_URL"

      - name: Upload binary, config, and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: |
            target/release/nim-usage-scanner
            config/
            output/
          if-no-files-found: warn
          retention-days: 30
